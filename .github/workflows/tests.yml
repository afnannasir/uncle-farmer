name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: pip-audit
        run: python -m pip_audit -r requirements.txt -r requirements-dev.txt
      - name: check.py (ruff, pyright, pytest, coverage floors)
        run: python check.py
      - name: coverage XML
        if: matrix.python-version == '3.14'
        run: python -m coverage xml
      - name: coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The game's agent is Java: compile it so a broken .java file cannot ship in a release.
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: python agent/build_agent.py
      - name: agent tests and packet parser fuzz
        run: python agent/java_tests.py
