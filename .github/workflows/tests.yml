name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python pyproject.toml allows, and the one the project is built and used with.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --locked: fails when pyproject.toml changed and uv.lock wasn't updated with `uv lock`.
      - run: uv sync --locked
      - name: pip-audit (the exact versions in uv.lock)
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "${{ runner.temp }}/locked-requirements.txt"
          uv run --locked pip-audit --requirement "${{ runner.temp }}/locked-requirements.txt" --require-hashes --disable-pip
      - name: check.py (ruff, pyright, pytest, coverage floors)
        run: uv run --locked python check.py
      - name: coverage XML
        if: matrix.python-version == '3.14'
        run: uv run --locked python -m coverage xml
      - name: coverage to Codecov
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # The game's agent is Java: compile it so a broken .java file cannot ship in a release.
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: python agent/build_agent.py
      - name: agent tests and packet parser fuzz
        run: python agent/java_tests.py
