# Uncle Farmer's CI/CD: every pull request into dev or master and every push to them is tested;
# a push to dev or master is then built into the Windows app, only after every check passed.
#
#   static   ruff, pyright and check-manifest (check.py --only ruff,pyright,manifest)
#   tests    the whole suite with coverage (uv run pytest --cov): the floors in pyproject.toml
#            (whole app) and check.py (the engine, check.py --only core)
#   audit    pip-audit of uv.lock
#   agent    the game agent's jar built, checked (Java 8 classes, manifest) and its Java tests run
#            (these four run at the same time, each exactly once, on Windows with Python 3.14)
#   actionlint  every workflow in .github/workflows checked by a pinned actionlint (Ubuntu)
#   build    push to dev    -> development build, artifact UncleFarmer-dev-<sha>        (14 days)
#            push to master -> production build,  artifact UncleFarmer-master-<ver>-<sha> (90 days)
#   publish-dev  after a dev build: the Dev release channel's pre-release v<ver>-dev.<run>
#
# Python 3.14 is the only Python the app supports and ships with, so there is no version matrix.
# Stable (master) releases stay manual (release.py): nothing here publishes one or signs anything.
# Only publish-dev writes to the repository, with the run's own GITHUB_TOKEN and no other secret: it
# publishes a dev build as a PRE-release, never marked latest, so the Master channel (GitHub's latest
# release) can't see it, and it only ever replaces or deletes dev pre-releases. CONTRIBUTING.md
# ("CI/CD") explains it all, branch rules included.
# Actions are pinned to full commit SHAs; the tag each one was taken from is in its comment.

name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:      # a manual run (tests, and the build when run on dev or master)

# Least privilege: the jobs only read the repository. No job asks for more.
permissions:
  contents: read

# One run per pull request or branch. A newer push to a pull request or to dev replaces the run in
# progress; a run on master is never cancelled (a production build finishes once started).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  static:
    name: Static checks (ruff, pyright)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # uv's download cache follows the lock and pyproject.toml; only the tests job saves it, so
      # the parallel jobs don't race to write the same entry. The .venv itself is never cached.
      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          save-cache: false

      # --locked: fails if pyproject.toml changed without `uv lock`; the lock is never rewritten here.
      - name: Install the locked dependencies
        run: uv sync --locked

      # check-manifest builds the source distribution (MANIFEST.in) with the locked setuptools and
      # fails when it and what git tracks differ.
      - name: check.py --only ruff,pyright,manifest
        run: uv run --locked python check.py --only ruff,pyright,manifest

  tests:
    name: Tests (Windows, Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install the locked dependencies
        run: uv sync --locked

      # The same tests and floors as on a developer's PC (python check.py): the whole suite with
      # coverage of unclefarmer/, a report of the lines missed, and a failure under
      # [tool.coverage.report] fail_under (78%). Then the engine's own floor (check.py CORE_FLOOR,
      # 92%) from the same run's data. The Java tests run in the agent job.
      - name: uv run pytest (whole suite, coverage)
        run: uv run --locked pytest -q -p no:cacheprovider --cov --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/pytest.xml

      - name: Engine coverage floor (check.py --only core)
        run: uv run --locked python check.py --only core

      - name: Keep the test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: reports/
          retention-days: 14
          if-no-files-found: warn     # a run that fails before pytest has no reports to keep

  audit:
    name: Dependency audit (pip-audit)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          save-cache: false

      # Every locked package, hashes required: what a player's copy and the build would get.
      - name: Audit the locked dependencies (pip-audit)
        shell: bash
        run: |
          uv export --locked --all-groups --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/locked-requirements.txt"
          uv run --locked pip-audit --requirement "$RUNNER_TEMP/locked-requirements.txt" --require-hashes --disable-pip

  agent:
    name: Java agent (build, Java 8 check, tests)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up a JDK (Temurin 17; the jar targets Java 8 with --release 8)
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # The agent's scripts use the standard library only: no dependencies to install or cache.
      - name: Set up Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Build the agent jar (agent/build_agent.py)
        shell: bash
        run: uv run --no-project python agent/build_agent.py "$RUNNER_TEMP/agent/unclefarmer-agent.jar"

      - name: Check the jar (manifest, every class Java 8)
        shell: bash
        run: uv run --no-project python ci_build.py verify-agent "$RUNNER_TEMP/agent/unclefarmer-agent.jar"

      - name: Agent tests and packet parser fuzz (agent/java_tests.py)
        run: uv run --no-project python agent/java_tests.py

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: "1.7.12"
      # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, from that release's checksums file
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release binary, checked against its published SHA-256: no script piped to a shell, and
      # the same actionlint on every run. It runs the runner's own shellcheck over each `run:`.
      - name: Install actionlint ${{ env.ACTIONLINT_VERSION }} (checksum verified)
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: actionlint (every workflow in .github/workflows)
        run: '"$RUNNER_TEMP/actionlint" -color'

  build:
    # A plain name: a skipped job shows an expression in its name unevaluated. The build type is
    # in the artifact's name, build-info.json and the run's summary.
    name: Windows build
    # Only after every check passed, and only for dev and master themselves: a pull request is
    # tested, never built, and no other branch is built.
    needs: [static, tests, audit, agent, actionlint]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/master')
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}
      release_version: ${{ steps.build.outputs.release_version }}
    env:
      BUILD_TYPE: ${{ github.ref_name == 'master' && 'production' || 'development' }}
      UPX_VERSION: "5.3.0"
      # SHA-256 of upx-5.3.0-win64.zip from github.com/upx/upx/releases (as published in the
      # Chocolatey package's VERIFICATION.txt). A download that doesn't match stops the build.
      UPX_SHA256: D127996C76615E431BE810E9C8D2910DBE3DD400600C5C0C50276FC5A17A9705
    steps:
      # The same commit the test jobs checked: one run, one github.sha. ci_build.py checks it again.
      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up uv and Python 3.14 (the release Python)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
          save-cache: false

      - name: Install the locked dependencies (Nuitka included)
        run: uv sync --locked

      # No Nuitka compile cache: builds are rare, so each one compiles from nothing (~18 minutes)
      # rather than keeping a per-branch cache in the repository's Actions storage.
      - name: Set up a JDK for the agent
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install UPX ${{ env.UPX_VERSION }} (checksum verified)
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "upx.zip"
          $url = "https://github.com/upx/upx/releases/download/v$env:UPX_VERSION/upx-$env:UPX_VERSION-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash -Algorithm SHA256 $zip).Hash
          if ($got -ne $env:UPX_SHA256) { Write-Error "UPX download checksum mismatch: $got"; exit 1 }
          Expand-Archive $zip -DestinationPath $env:RUNNER_TEMP -Force
          $dir = Join-Path $env:RUNNER_TEMP "upx-$env:UPX_VERSION-win64"
          & (Join-Path $dir "upx.exe") --version | Select-Object -First 1
          "UPX_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # build_exe.py (agent jar, Nuitka, data, folder check) and release.py's zip, then the zip
      # check, the built exe's self-test, build-info.json and the SHA-256 (ci_build.py).
      - name: Build, check and describe the app (ci_build.py)
        id: build
        run: uv run --locked python ci_build.py build --type ${{ env.BUILD_TYPE }} --out dist/ci

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: |
            dist/ci/*.zip
            dist/ci/*.zip.sha256
            dist/ci/build-info.json
          if-no-files-found: error
          retention-days: ${{ env.BUILD_TYPE == 'production' && 90 || 14 }}
          compression-level: 0      # the zip is already compressed

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Uncle Farmer ${BUILD_TYPE} build"
            echo ""
            echo "Artifact: **${{ steps.build.outputs.artifact }}** (download it from this run's Artifacts)"
            echo ""
            echo "Release version: **${{ steps.build.outputs.release_version }}**"
            echo ""
            echo '```'
            cat dist/ci/*.zip.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-dev:
    # The Dev release channel: the build just made and checked, as a GitHub pre-release the updater
    # finds when a copy is set to Dev. dev only; a master build is never published here.
    name: Publish the dev build
    needs: [build]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The only job that writes: releases and their tags (contents), and reading this run's
    # artifact (actions). The build job, which runs the whole toolchain, stays read-only.
    permissions:
      contents: write
      actions: read
    # Two publishes never run at once. A newer push to dev still cancels this whole run (the
    # workflow's concurrency): a pre-release left without its zip is skipped by the updater, and
    # later runs prune it like any old dev build.
    concurrency:
      group: publish-dev
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
      ARTIFACT: ${{ needs.build.outputs.artifact }}
    steps:
      # ci_build.py's publish-dev uses the standard library and gh only: nothing is installed.
      - name: Check out the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.14
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Fetch the build from this run
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir dist/ci

      - name: Publish the pre-release (ci_build.py publish-dev)
        run: |
          zip=$(ls dist/ci/UncleFarmer-dev-*.zip)
          uv run --no-project python ci_build.py publish-dev --zip "$zip" --version "$RELEASE_VERSION" --sha "$GITHUB_SHA"

      - name: Summary
        run: |
          {
            echo "### Dev channel"
            echo ""
            echo "Published pre-release **v${RELEASE_VERSION}** (asset UncleFarmer-${RELEASE_VERSION}.zip)."
          } >> "$GITHUB_STEP_SUMMARY"
