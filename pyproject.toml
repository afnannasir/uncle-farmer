# Everything Uncle Farmer needs, in one place. uv.lock pins the exact versions; `uv sync` installs
# them into .venv (the app, the checking tools and Nuitka), and CI's `uv sync --locked` fails when
# this file changed without `uv lock`.

[project]
name = "unclefarmer"
version = "1.0.1"            # release.py sets this together with unclefarmer/__init__.py
description = "A farming bot for Mist World."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.14"
# What the built app ships: the only packages a player's copy carries.
dependencies = [
    "wxPython>=4.2",
    "orjson>=3.10",
    "pydantic>=2.6",
    "numpy>=2",
]

[dependency-groups]
# Checking the code: check.py, the benchmarks, nightwatch.py and profile_bot.py.
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "ruff>=0.17",
    "pyright>=1.1.400",
    "yappi",
    "py-spy",
    "cachebox",
    "pip-audit>=2.10",
    "check-manifest>=0.50",
]
# Building the shareable folder: build_exe.py and release.py.
build = ["nuitka"]

# Only for the source distribution (MANIFEST.in), which check-manifest builds and compares with
# git: the app is run from its folder and never installed, so nothing is packaged as modules
# (packages and py-modules are empty) and uv never builds it (package = false below).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
py-modules = []

[tool.check-manifest]
# The compiled catalogs are tracked on purpose: the app and its build read them as they are (the
# app's own is compiled from lang/ur.po by `python -m unclefarmer --strings`, wxstd.mo is
# wxPython's own catalog, with no source here).
ignore-bad-ideas = ["lang/*/LC_MESSAGES/*.mo"]

[tool.uv]
# An app run from its folder, not a package to install: uv installs only the dependencies.
package = false
default-groups = ["dev", "build"]
# The game and the bot run on Windows only, so the lock resolves for Windows only.
environments = ["sys_platform == 'win32'"]

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["build", "dist", "survey"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors and warnings, bugbear (likely bugs), and McCabe complexity (C901)
select = ["E", "F", "W", "B", "C90"]
ignore = [
    "E501",   # a few lines run long on purpose (tables, long messages); 120 is the aim
    "E741",   # short names like l for a line are fine here
    "E731",   # small lambdas assigned to names
    "E401",   # two stdlib imports on one line inside a function
    "B007",   # loop variables kept for readability
    "B904",   # `raise ... from` would only change tracebacks; the messages are what players read
    "B905",   # zip() without strict=: the lengths match by construction
    "B023",   # closures called within the same loop turn, never later
]

[tool.ruff.lint.mccabe]
# How many ways a function can go (each if, loop, try, and/or adds one) before ruff warns.
# 10, ruff's default, flags plain lookups and checklists too; past 15 a function has too many
# paths to read or test, and it is split into named steps instead.
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: takes a second or more of real time (CPU measurements, fights, route searches)",
           "soak: hours of game time against tests/simgame.py; skipped unless --soak is given"]
addopts = "-ra -n auto"

[tool.coverage.run]
source = ["unclefarmer"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
# The whole app, GUI included: what pytest --cov fails under, here and in CI (check.py and the
# workflow's tests job both run it). check.py also gates the engine on its own (CORE_FLOOR, 92%):
# the GUI has few tests, so a single total would let the engine rot while the number held.
fail_under = 78
show_missing = true
skip_covered = true
